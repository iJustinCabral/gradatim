version: "3.8"

services:
  gradatim:
    build: .
    ports:
      - "${GRADATIM_PORT:-8080}:8080"
    environment:
      - GRADATIM_HOST=0.0.0.0
      - GRADATIM_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import http.client; c=http.client.HTTPConnection('127.0.0.1',8080); c.request('GET','/healthz'); r=c.getresponse(); exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
